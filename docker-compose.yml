services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meeting_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/meeting_intelligence?schema=public
      JWT_SECRET: change-me
      GROQ_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      PORT: 3000
      REMINDER_JOB_ENABLED: "false"
      EVALUATION_CANDIDATE_NAME: ""
      EVALUATION_EMAIL: ""
      EVALUATION_REPOSITORY_URL: ""
      EVALUATION_DEPLOYED_URL: ""
    ports:
      - "3000:3000"

volumes:
  pg_data:

